<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#126B86" />
    <meta
      name="description"
      content="See the barriers. Build beyond them. AccessLens is an accessibility workspace for developers, QA teams, and agencies. Explore the product preview."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AccessLens — See the barriers. Build beyond them.</title>
    <script>
      try {
        const saved = localStorage.getItem('accesslens-theme');
        const dark =
          saved === 'dark' ||
          (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
